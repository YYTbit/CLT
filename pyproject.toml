[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-lattice-training"
version = "0.1.1"
description = "Causal-Lattice Training for test-time adaptation of Web agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "tldextract>=5.1,<6"]

[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers>=4.57,<5", "peft>=0.17,<0.19", "accelerate>=1.5,<2", "sentencepiece>=0.2,<0.3", "safetensors>=0.5"]
test = ["pytest>=8,<9"]

[project.scripts]
clt = "clt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
